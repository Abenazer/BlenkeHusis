name: Release

# Runs only when a version tag (v1.2.3) is pushed by hand, so when to release,
# and as what version, is always a deliberate choice. The tag must match
# VERSION in src/version.js. This publishes the Docker image as
# ghcr.io/abenazer/blenkehusis:<version> and creates a GitHub release for
# the tag with a zip of the game and that version's CHANGELOG section as its
# notes. Everyday pushes to main only update :latest (docker.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# Releases run one at a time and are never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A normal run takes under a minute; a hang shouldn't burn more than this.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - id: version
        name: Check the tag against the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node --input-type=module -e "import { VERSION } from './src/version.js'; console.log(VERSION);")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match VERSION $version in src/version.js; tag the commit that bumps it."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Includes the version test: package.json and CHANGELOG.md must agree.
      - name: Syntax check
        run: find src tests -name '*.js' -print0 | xargs -0 -rn1 node --check

      - name: Run tests
        run: node --test tests/

      - name: Build the zip and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "dist/blenkehusis-$VERSION"
          cp -r index.html src css assets "dist/blenkehusis-$VERSION/"
          printf "export const BUILD_TIME = '%s';\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "dist/blenkehusis-$VERSION/src/build.js"
          (cd dist && zip -qr "blenkehusis-$VERSION.zip" "blenkehusis-$VERSION")
          awk -v heading="## [$VERSION] - " \
            'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' \
            CHANGELOG.md > dist/notes.md
          test -s dist/notes.md

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase and the owner isn't; metadata-action
      # lowercases it, and its labels link the package to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/blenkehusis
          tags: type=raw,value=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" "dist/blenkehusis-$VERSION.zip" \
            --verify-tag \
            --title "Blenke Husis & Urinjakten $VERSION" \
            --notes-file dist/notes.md
