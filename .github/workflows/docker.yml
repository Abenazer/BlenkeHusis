name: Docker image

# Builds the image and publishes it to GitHub's container registry as
# ghcr.io/abenazer/superlelle:latest, replacing the previous one; versioned
# images come only from a release (release.yml). Only
# changes to what goes into the image trigger it. The run's own GITHUB_TOKEN
# pushes the image, so no secret is needed.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'css/**'
      - 'assets/**'
      - 'Dockerfile'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# A newer push replaces an image still being built for an older one.
concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # A normal run takes under a minute; a hang shouldn't burn more than this.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The image is never published from code that fails its own tests.
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Syntax check
        run: find src tests -name '*.js' -print0 | xargs -0 -rn1 node --check

      - name: Run tests
        run: node --test tests/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase and the owner isn't; metadata-action
      # lowercases it. Its labels also link the package to this repository,
      # though the package's visibility is set separately (it's public).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/superlelle
          tags: type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
